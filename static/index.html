<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Codex">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Codex</title>
<link rel="manifest" href="/static/manifest.webmanifest?v=0.12.2">
<link rel="apple-touch-icon" sizes="180x180" href="/static/assets/pwa/codex-180.png?v=0.12.2">
<link rel="icon" type="image/png" sizes="192x192" href="/static/assets/pwa/codex-192.png?v=0.12.2">
<link rel="stylesheet" href="/static/style.css?v=0.12.3">
<link rel="stylesheet" href="/static/vendor/highlight.css">
<link rel="stylesheet" href="/static/vendor/katex/katex.min.css">
<link rel="stylesheet" href="/static/markdown.css?v=0.12.2">
<script type="module" src="/static/app.js?v=0.12.3"></script>
</head>
<body>
<svg class="iconDefinitions" aria-hidden="true" xmlns="http://www.w3.org/2000/svg"><defs>
<symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 16h10"/></symbol>
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-new-chat" viewBox="0 0 24 24"><path d="M5.4 18.2A9 9 0 1 1 9 20.5l-4.8.8 1.2-3.1ZM12 7.5v9M7.5 12h9"/></symbol>
<symbol id="i-close" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
<symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 4v16m-7-7 7 7 7-7"/></symbol>
<symbol id="i-chevron" viewBox="0 0 24 24"><path d="m8 10 4 4 4-4"/></symbol>
<symbol id="i-bulb" viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M8 14a6 6 0 1 1 8 0c-1 1-1 2-1 2H9s0-1-1-2ZM12 1v1M3 5l1 1M20 5l-1 1M1 11h2M21 11h2"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M5 7a8 8 0 0 1 13-2l2 2M19 17a8 8 0 0 1-13 2l-2-2"/></symbol>
</defs></svg>
<main>
<section id="login" class="loginPage" hidden aria-label="登录"><div class="loginContent"><img class="loginLogo" src="/static/assets/chatgpt.svg" alt="ChatGPT" width="72" height="72"><form id="loginForm"><label class="srOnly" for="password">登录口令</label><input id="password" type="password" placeholder="请输入登录口令" autocomplete="current-password" required><button class="loginButton">登录</button></form><p id="loginError" role="alert"></p></div></section>
<section id="workspace" hidden>
<aside id="drawer" hidden role="dialog" aria-modal="true" aria-label="历史对话" tabindex="-1"><div class="drawerHeader"><h2>对话</h2><div class="row"><button id="refresh" type="button" class="iconButton" aria-label="刷新对话列表"><svg class="icon"><use href="#i-refresh"/></svg></button><button id="closeDrawer" type="button" class="iconButton" aria-label="关闭侧栏"><svg class="icon"><use href="#i-close"/></svg></button></div></div><div class="drawerBody"><nav id="threadList" aria-label="已有对话"></nav><label class="srOnly">选择要继续的对话<select id="threads" tabindex="-1" aria-hidden="true"><option value="">请选择</option></select></label><button id="more" type="button" class="secondary loadMore" hidden>加载更早的对话</button>
<section id="usageCard" class="usageCard" aria-label="Codex 额度" hidden><div class="row"><h2>Codex 额度</h2><button type="button" class="secondary">刷新</button></div><div class="usageGrid"><div class="usageTile unknown" data-window="fiveHour"><h3>五小时剩余</h3><strong class="usagePercent">—</strong><span class="usageDetail">暂不可用</span><progress max="100" value="0" aria-label="五小时剩余" hidden></progress><p class="usageReset">等待额度数据</p></div><div class="usageTile unknown" data-window="weekly"><h3>周额度剩余</h3><strong class="usagePercent">—</strong><span class="usageDetail">暂不可用</span><progress max="100" value="0" aria-label="周额度剩余" hidden></progress><p class="usageReset">等待额度数据</p></div></div><p class="usageStatus muted" role="status">正在读取额度…</p></section>
<details class="drawerTools"><summary>工具与连接<svg class="icon"><use href="#i-chevron"/></svg></summary><div class="toolsContent"><span id="connection" role="status">连接中</span><p id="serviceInfo" class="muted">正在读取连接模式…</p><p id="upgradeNotice" class="muted" role="status" hidden></p><p id="desktopState" class="muted"></p><button id="openDesktop" type="button" class="secondary" hidden>在电脑连接此对话</button><div id="handoff" class="row"><button id="takeover" disabled>手机接管</button><button id="release" class="secondary" disabled>交还电脑</button></div><p id="modeHint" class="muted"></p><p id="threadInfo" class="muted"></p><p id="runStatus" class="muted"></p><button id="historyRefresh" type="button" class="secondary">刷新历史</button><button id="fillTest" type="button" class="secondary">填入一次连接测试</button><section id="creationCard" hidden><h3>新对话创建记录</h3><div id="creations"></div></section><button id="logout" type="button" class="secondary">退出登录</button><p class="version">v0.12.3 · 支持全屏状态栏、历史侧滑、计划模式与媒体附件。</p></div></details></div></aside>
<div id="chatShell" class="chatShell"><header class="chatHeader"><button id="openDrawer" type="button" class="iconButton navCircle" aria-label="打开历史对话" aria-controls="drawer" aria-expanded="false"><svg class="icon"><use href="#i-menu"/></svg></button><h1 id="chatTitle"></h1><button id="newThread" type="button" class="iconButton navCircle" aria-label="新建对话"><svg class="icon"><use href="#i-new-chat"/></svg></button></header>
<div id="toastStack" class="toastStack" aria-label="状态提示"></div><div id="notice" class="toastSource" aria-hidden="true" hidden></div><p id="connectionAlert" class="connectionAlert toastSource" aria-hidden="true" hidden></p>
<div id="chatViewport" class="chatViewport"><div id="chatScroll" class="chatScroll" tabindex="-1"><div class="chatContent"><section id="welcome" class="welcome" hidden><img src="/static/assets/chatgpt.svg" alt="ChatGPT" width="52" height="52"><h2>你好，有什么我可以帮你的吗？</h2></section><section id="transcript" aria-label="对话记录"><div id="history"></div><div id="live" aria-live="polite"></div></section><section id="questions" aria-label="待你回答"></section><p id="planRecoveryHint" class="muted" role="status" hidden>历史方案仍可查看。电脑当前没有待采用的方案确认；如需继续，请选择计划模式并应用，再发送完善意见或要求重新确认方案。</p><section id="planReview" class="card planReview" hidden aria-label="最终方案确认"><h2>最终方案</h2><p id="planReviewHint" class="muted"></p><details><summary>查看完整方案</summary><div id="planReviewBody" class="body"></div></details><div class="row planActions"><button id="implementPlan" type="button">采用并实施</button><button id="refinePlan" type="button" class="secondary">继续完善</button></div><p id="planResult" class="muted" role="status"></p></section></div></div></div>
<div id="composerDock" class="composerDock"><button id="scrollToBottom" class="scrollToBottom" type="button" aria-label="回到对话底部" title="回到对话底部" hidden><svg class="icon" aria-hidden="true"><use href="#i-arrow-down"/></svg></button><section id="queueCard" hidden aria-label="待发送队列"><p id="queueAlert" class="queueAlert" role="status" hidden></p><details id="queueDetails"><summary><span>待发送</span><span id="queueCount"></span><svg class="icon"><use href="#i-chevron"/></svg></summary><div class="queueContents"><p id="queueHint" class="muted"></p><ol id="desktopQueue"></ol><div id="outbox"></div></div></details></section><div class="resumeRow"><button type="button" id="resumeTurn" class="secondary" hidden>继续本次任务</button></div>
<section id="settingsPanel" class="settingsPanel" hidden role="dialog" aria-modal="true" aria-labelledby="panelTitle" tabindex="-1"><div class="row"><h2 id="panelTitle">对话设置</h2><button id="closeSettings" type="button" class="iconButton" aria-label="关闭设置"><svg class="icon"><use href="#i-close"/></svg></button></div><div id="newLocation" hidden><label for="project">对话位置</label><select id="project"><option value="">独立对话</option></select></div><div id="modelControls" hidden><div id="nativeModeControl"><label class="srOnly">对话模式<select id="conversationMode" tabindex="-1" aria-hidden="true"><option value="default">执行模式</option><option value="plan">计划模式</option></select></label><div class="modeChoices"><button type="button" data-mode="default"><span>执行模式</span><svg class="icon"><use href="#i-check"/></svg></button><button type="button" data-mode="plan"><span><svg class="icon"><use href="#i-bulb"/></svg>计划模式</span><svg class="icon"><use href="#i-check"/></svg></button></div><p id="nativeModeHint" class="muted" role="status"></p></div><div class="settingFields"><div class="settingField"><label for="model">模型</label><select id="model"></select></div><div class="settingField"><label for="effort">思考强度</label><select id="effort"></select></div></div><p id="settingsStatus" class="muted" role="status"></p><p id="settingsHint" class="muted"></p><button id="applySettings" type="button">应用设置</button></div><label id="planControl" class="check"><input type="checkbox" id="plan">讨论模式（用于方案与真实选择题）</label></section>
<form id="compose" class="composer"><div id="imageDrafts" class="imageDrafts" hidden aria-label="待发送附件"></div><input id="imageFiles" type="file" accept="image/*,video/*,.heic,.heif,.mp4,.mov" multiple hidden><label id="promptLabel" for="prompt" class="srOnly">发送到当前对话</label><textarea id="prompt" placeholder="发送消息…" rows="2" maxlength="50000"></textarea><div class="composerToolbar"><div class="composerLeft"><button id="openMode" type="button" class="iconButton" aria-label="添加附件或切换模式" aria-controls="attachmentMenu" aria-expanded="false"><svg class="icon"><use href="#i-plus"/></svg></button><div id="attachmentMenu" class="attachmentMenu" hidden role="menu" aria-label="添加与模式"><button id="chooseImages" type="button" role="menuitem">传输文件</button><button id="chooseMode" type="button" role="menuitem">模式切换</button></div><span id="planBadge" class="planBadge" hidden><svg class="icon"><use href="#i-bulb"/></svg>计划</span></div><div class="composerRight"><button id="openModel" type="button" class="modelTrigger" aria-label="选择模型与思考强度" aria-controls="settingsPanel" aria-expanded="false"><span id="modelLabel">桌面默认</span><span id="dirtyDot" class="dirtyDot" hidden aria-label="设置尚未应用"></span><svg class="icon"><use href="#i-chevron"/></svg></button><button type="button" id="stop" class="stopButton" disabled aria-label="暂停思考">停止本轮</button><button id="send" class="sendButton" disabled aria-label="发送">发送</button></div></div></form></div><button id="settingsScrim" class="settingsScrim" type="button" tabindex="-1" aria-label="关闭设置" hidden></button></div><button id="drawerScrim" class="drawerScrim" type="button" aria-label="返回聊天" hidden></button>
</section>
</main>
</body></html>
